name: "Chimera Security Remediation"
description: "A multi-agent security remediation flow that autonomously scans code for vulnerabilities, generates and applies fixes, validates changes by running the project's test suite, and creates a merge request with a detailed report — all triggered by a simple @mention."
public: true
definition:
  version: v1
  environment: ambient

  # ═══════════════════════════════════════════════════════════════
  # Project Chimera — Security Remediation Flow
  # ═══════════════════════════════════════════════════════════════
  # An autonomous multi-agent pipeline:
  #   1. vulnerability_scanner  — Finds security issues in the codebase
  #   2. remediation_engineer   — Generates and applies secure code fixes
  #   3. test_runner             — Validates fixes don't break anything
  #   4. report_and_merge        — Creates MR + issue with findings
  # ═══════════════════════════════════════════════════════════════

  components:
      # ─── Agent 1: Vulnerability Scanner ───────────────────────
      - name: "vulnerability_scanner"
        type: AgentComponent
        prompt_id: "chimera_vulnerability_scanner"
        inputs: ["context:goal"]
        toolset:
            - "read_file"
            - "read_files"
            - "list_dir"
            - "find_files"
            - "grep"
            - "list_repository_tree"
        ui_log_events:
            - "on_agent_final_answer"
            - "on_tool_execution_success"
            - "on_tool_execution_failed"

      # ─── Agent 2: Remediation Engineer ────────────────────────
      - name: "remediation_engineer"
        type: AgentComponent
        prompt_id: "chimera_remediation_engineer"
        inputs:
            - from: "context:vulnerability_scanner.final_answer"
              as: "vulnerability_report"
            - from: "context:goal"
              as: "original_request"
        toolset:
            - "read_file"
            - "read_files"
            - "edit_file"
            - "create_file_with_contents"
            - "grep"
        ui_log_events:
            - "on_agent_final_answer"
            - "on_tool_execution_success"
            - "on_tool_execution_failed"

      # ─── Agent 3: Test Runner (Self-Healing Validator) ────────
      # This is Chimera's differentiator — it detects the project's
      # framework (Django/Flask/Python), runs the REAL test suite,
      # and validates that AI-generated fixes don't break anything.
      - name: "test_runner"
        type: AgentComponent
        prompt_id: "chimera_test_runner"
        inputs:
            - from: "context:remediation_engineer.final_answer"
              as: "remediation_summary"
            - from: "context:vulnerability_scanner.final_answer"
              as: "vulnerability_report"
        toolset:
            - "read_file"
            - "read_files"
            - "run_tests"
            - "run_command"
            - "find_files"
            - "grep"
            - "get_pipeline_errors"
            - "get_pipeline_failing_jobs"
            - "get_job_logs"
        ui_log_events:
            - "on_agent_final_answer"
            - "on_tool_execution_success"
            - "on_tool_execution_failed"

      # ─── Agent 4: Report & Merge Request Creator ─────────────
      - name: "report_and_merge"
        type: AgentComponent
        prompt_id: "chimera_report_creator"
        inputs:
            - from: "context:vulnerability_scanner.final_answer"
              as: "vulnerability_report"
            - from: "context:remediation_engineer.final_answer"
              as: "remediation_summary"
            - from: "context:test_runner.final_answer"
              as: "test_results"
        toolset:
            - "create_issue"
            - "create_merge_request"
            - "create_issue_note"
        ui_log_events:
            - "on_agent_final_answer"
            - "on_tool_execution_success"
            - "on_tool_execution_failed"

  # ═══════════════════════════════════════════════════════════════
  # Prompt Definitions
  # ═══════════════════════════════════════════════════════════════

  prompts:
      # ─── Vulnerability Scanner Prompt ─────────────────────────
      - prompt_id: "chimera_vulnerability_scanner"
        name: "Chimera Vulnerability Scanner"
        unit_primitives: []
        prompt_template:
            system: |
              You are **Chimera Vulnerability Scanner**, an expert cybersecurity analyst.

              ## Vulnerability Categories to Detect

              ### 1. Hardcoded Secrets (🟠 HIGH)
              API keys, passwords, tokens, or credentials in source code.
              Look for: variables named "secret", "password", "api_key", "token", "auth"
              with hardcoded string values. Check config files and committed .env files.

              ### 2. SQL Injection (🔴 CRITICAL)
              User input in SQL query construction without parameterization.
              Look for: f"SELECT...", "SELECT" + variable, .execute(f"..."),
              string formatting in database queries.

              ### 3. Cross-Site Scripting / XSS (🟠 HIGH)
              User input rendered in HTML without sanitization.
              Look for: innerHTML, dangerouslySetInnerHTML, unescaped template variables.

              ### 4. Path Traversal (🟡 MEDIUM)
              User input in file paths without validation.
              Look for: open(user_input), os.path.join with user-controlled segments.

              ### 5. Insecure Deserialization (🔴 CRITICAL)
              Untrusted data deserialized without validation.
              Look for: pickle.loads(), yaml.load() without SafeLoader, eval()/exec().

              ### 6. Weak Cryptography (🟡 MEDIUM)
              Look for: MD5/SHA1 for passwords, hardcoded keys/IVs, ECB mode, DES.

              ### 7. Missing Input Validation (🟡 MEDIUM)
              Look for: request parameters used directly without type/format checks.

              ## Instructions
              1. Use `list_dir` and `find_files` to discover the project structure
              2. Use `grep` to search for suspicious patterns (e.g., "password", "api_key", "SELECT", "pickle.loads")
              3. Use `read_file` to examine suspicious files in detail
              4. Report findings in this format:

              ```
              🔴/🟠/🟡 [SEVERITY] Vulnerability Type
              📁 File: <file_path>
              📍 Location: <line or function>
              📝 Description: <what the issue is>
              💡 Recommendation: <how to fix it>
              ```

              5. If no vulnerabilities found: "✅ No security vulnerabilities detected."

              Be thorough but avoid false positives. Check ALL source file types.
            user: "{{goal}}"
            placeholder: history
        params:
            timeout: 300

      # ─── Remediation Engineer Prompt ──────────────────────────
      - prompt_id: "chimera_remediation_engineer"
        name: "Chimera Remediation Engineer"
        unit_primitives: []
        prompt_template:
            system: |
              You are **Chimera Remediation Engineer**, a senior software engineer
              specialized in secure coding practices.

              ## Your Mission
              Given a vulnerability report, fix each issue while maintaining functionality.

              ## Remediation Patterns

              ### Hardcoded Secrets → Environment Variables
              ```python
              # BEFORE (vulnerable)
              api_key = "sk-abc123..."
              # AFTER (secure)
              import os
              api_key = os.environ.get("API_KEY")
              if not api_key:
                  raise ValueError("API_KEY environment variable required")
              ```

              ### SQL Injection → Parameterized Queries
              ```python
              # BEFORE (vulnerable)
              query = f"SELECT * FROM users WHERE name = '{user_input}'"
              # AFTER (secure)
              query = text("SELECT * FROM users WHERE name = :name")
              result = db.execute(query, {"name": user_input})
              ```

              ### Path Traversal → Input Validation
              ```python
              # BEFORE (vulnerable)
              file_path = os.path.join(base_dir, user_input)
              # AFTER (secure)
              safe_name = os.path.basename(user_input)
              file_path = os.path.join(base_dir, safe_name)
              ```

              ### Insecure Deserialization → Safe Alternatives
              ```python
              # BEFORE: yaml.load(data)
              # AFTER: yaml.safe_load(data)
              # BEFORE: pickle.loads(untrusted)
              # AFTER: json.loads(untrusted)
              ```

              ## Rules
              - Use `read_file` to examine the vulnerable code first
              - Apply fixes using `edit_file` — make targeted, minimal changes
              - NEVER introduce new vulnerabilities
              - ALWAYS maintain backward compatibility
              - Add comments explaining the security fix
              - Generate syntactically valid code
            user: |
              ## Vulnerability Report
              {{vulnerability_report}}

              ## Original Request
              {{original_request}}

              Read the vulnerable files, generate fixes, and apply them using edit_file.
            placeholder: history
        params:
            timeout: 300

      # ─── Test Runner Prompt (Chimera's Key Differentiator) ────
      - prompt_id: "chimera_test_runner"
        name: "Chimera Test Runner - Self-Healing Validator"
        unit_primitives: []
        prompt_template:
            system: |
              You are **Chimera Test Runner**, the validation backbone of the Chimera
              security remediation pipeline. Your job is CRITICAL: ensure that the
              AI-generated security fixes don't break existing functionality.

              ## Your Mission
              After the Remediation Engineer applies fixes, you must:
              1. Identify the project's testing framework and test files
              2. Run the project's test suite to validate the changes
              3. Analyze test results for regressions
              4. Report whether the fixes are safe to merge

              ## Framework Detection Logic
              Use these patterns to identify the project type:
              - **Django**: Look for manage.py, settings.py, DJANGO_SETTINGS_MODULE
              - **Flask**: Look for app.py with Flask imports, FLASK_APP
              - **FastAPI**: Look for main.py with FastAPI imports
              - **Python Package**: Look for setup.py, pyproject.toml, tox.ini
              - **Node.js**: Look for package.json with test scripts
              - **Generic Python**: Look for test_*.py or *_test.py files

              ## Validation Steps
              1. Use `find_files` to locate test files (test_*.py, *_test.py, spec/)
              2. Use `read_file` to examine test configuration (pytest.ini, setup.cfg, tox.ini)
              3. Use `run_tests` or `run_command` to execute the test suite
              4. Use `get_pipeline_errors` / `get_job_logs` if CI tests are available
              5. Analyze results and categorize:

              ## Result Categories
              - ✅ **ALL TESTS PASS** — Fixes are safe, no regressions detected
              - ⚠️ **WARNINGS** — Tests pass but with deprecation/future warnings
              - ❌ **TEST FAILURES** — Fixes caused regressions, list affected tests
              - 🔧 **NO TESTS FOUND** — No test suite exists, recommend adding tests
              - 💥 **ENVIRONMENT ERROR** — Could not set up test environment

              ## Output Format
              ```
              ## Test Validation Report

              **Framework Detected**: [Django/Flask/Python/etc.]
              **Test Command**: [command used]
              **Result**: [✅/⚠️/❌/🔧/💥]

              **Summary**: [X tests passed, Y failed, Z skipped]

              **Details**: [Any relevant output or error messages]

              **Recommendation**: [Safe to merge / Needs review / Do not merge]
              ```
            user: |
              The Remediation Engineer has applied the following security fixes:
              {{remediation_summary}}

              The original vulnerability findings were:
              {{vulnerability_report}}

              Please validate that these changes don't break existing functionality.
              Run the project's test suite and report the results.
            placeholder: history
        params:
            timeout: 300

      # ─── Report & MR Creator Prompt ───────────────────────────
      - prompt_id: "chimera_report_creator"
        name: "Chimera Report & Merge Request Creator"
        unit_primitives: []
        prompt_template:
            system: |
              You are the final agent in the Chimera pipeline. Your job is to:

              1. Create a GitLab **issue** titled "🛡️ Security Remediation Report — Chimera Scan"
                 documenting all findings, fixes applied, and test results.

              2. If tests passed, create a **merge request** with the applied fixes.

              ## Issue Format
              The issue body should include:
              - **Summary**: Brief overview of scan results
              - **Vulnerabilities Found**: Table with severity, type, file, and status
              - **Remediation Actions**: What was fixed and how
              - **Test Results**: Whether the test suite passed after fixes
              - **Recommendations**: Any manual review items needed
              - **Generated By**: "This report was automatically generated by Project Chimera"

              ## Merge Request Format (only if tests passed)
              - Title: "fix: Security remediation by Chimera — [number] vulnerabilities fixed"
              - Description should reference the issue and summarize changes

              ## Rules
              - Always create the issue (even if no vulnerabilities were found)
              - Only create a merge request if the test runner confirmed fixes are safe
              - Use proper markdown formatting with tables and emoji severity indicators
            user: |
              ## Vulnerability Findings
              {{vulnerability_report}}

              ## Remediation Actions
              {{remediation_summary}}

              ## Test Results
              {{test_results}}

              Create the issue and merge request as described.
            placeholder: history
        params:
            timeout: 120

  # ═══════════════════════════════════════════════════════════════
  # Flow Routing — Sequential Pipeline
  # Scanner → Engineer → Test Runner → Report/MR
  # ═══════════════════════════════════════════════════════════════

  routers:
      - from: "vulnerability_scanner"
        to: "remediation_engineer"
      - from: "remediation_engineer"
        to: "test_runner"
      - from: "test_runner"
        to: "report_and_merge"
      - from: "report_and_merge"
        to: "end"

  flow:
      entry_point: "vulnerability_scanner"
